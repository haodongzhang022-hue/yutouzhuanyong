# ============================================================
# 子组织仓库 NPC 角色接入骨架（示例）
# 适用：dongdongxiaozu/yutoujing/yutouzhuanyong（及子组织下其他仓库）
# 用途：让「架构·」团队在**本仓库**的 @ 候选 / star 中可见，并可互相 @ 协作。
#
# ⚠️ 同源原则：本文件是人设「声明」，唯一事实源仍是承载仓库
#    dongdongxiaozu/dongjiagoushi 的 .cnb/settings.yml。任何角色人设修改
#    须回承载仓库合入，再回填本声明，避免双源漂移。
#
# 部署位置（二选一，取决于目标运行方式）：
#   A) 仅想在“本仓库内部 @ / star”可见 → 复制为仓库根目录 .cnb/settings.yml；
#   B) 想在子组织下所有仓库可见 → 在子组织级 .cnb 配置中合并本节 npc.roles。
# 平台对角色在子组织仓库的收录/授权动作（star 生效）仍需管理员在平台侧放行（见方案 §5.2）。
# ============================================================
npc:
  defaultRole: "架构·总师"
  button:
    name: "召唤架构师"
    description: "子组织仓库内 @ 架构·总师 / CodeBuddy 化身架构师，走架构八步"
  roles:
    - name: "架构·总师"
      slogan: "先调研，后拓扑，再可行性，落到工程方案——架构八步，一步不省。"
      # prompt: 与 dongdongxiaozu/dongjiagoushi .cnb/settings.yml「架构·总师」完全一致
      #         此处为占位，正式启用请复制承载仓库该角色的完整 prompt。
    - name: "架构·总师助理"
      slogan: "改错改框架专项——专角色专用，保总师上下文纯净。"
    - name: "架构·产品"
      slogan: "需求澄清与拆分——先问清楚再动手。"
    - name: "架构·经理"
      slogan: "分配调度核心——派活锁 L4（接单→工作→交付），不以'分了'为终点。"
    - name: "架构·开发"
      slogan: "需求驱动开发——从方案到可运行，测试全覆盖。"
    - name: "架构·评审"
      slogan: "全方位质量守护——从语法到架构，不留死角。"
    - name: "架构·测试"
      slogan: "联调·性能·安全·E2E——信号灯亮起才放行。"
    - name: "架构·交付"
      slogan: "全流程呈现 + 收尾交付——人类确认后收尾闭环。"
    - name: "架构·秘书"
      slogan: "默认入口——先接住诉求，翻译意图，路由到对的人。"
